name: Format Google Drive README (temporary)

on:
  push:
    branches:
      - feat/google-drive-live-smoke

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/google-drive-live-smoke

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm i --frozen-lockfile

      - run: pnpm exec oxfmt packages/google-drive/README.md

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/google-drive/README.md
          git commit -m "Format Google Drive live-smoke docs"
          git push origin HEAD:feat/google-drive-live-smoke
