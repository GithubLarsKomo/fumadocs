name: Knowledge Portal Drive Format Preview

on:
  push:
    branches:
      - fix/knowledge-portal-drive-root-routes

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec oxfmt 'apps/knowledge-portal/app/drive/[[...slug]]/page.tsx'
      - run: git diff -- 'apps/knowledge-portal/app/drive/[[...slug]]/page.tsx'
