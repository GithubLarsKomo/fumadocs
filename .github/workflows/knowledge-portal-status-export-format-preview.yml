name: Knowledge Portal Status Export Format Preview

on:
  push:
    branches:
      - feat/knowledge-portal-status-json-export

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Format status export files
        run: |
          pnpm exec oxfmt \
            'apps/knowledge-portal/app/api/health/export/route.ts' \
            apps/knowledge-portal/app/global.css \
            apps/knowledge-portal/app/status/page.tsx \
            apps/knowledge-portal/lib/status-export.ts
      - name: Show formatter diff
        run: git diff
