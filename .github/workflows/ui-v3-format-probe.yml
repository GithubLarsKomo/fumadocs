name: UI v3 Format Probe

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/knowledge-portal/app/global.css'
      - 'apps/knowledge-portal/components/brain-switcher.tsx'
      - 'apps/knowledge-portal/components/document-actions.tsx'
      - 'apps/knowledge-portal/components/knowledge-status.tsx'
      - 'apps/knowledge-portal/lib/brain-markdown.ts'
      - 'apps/knowledge-portal/lib/brain-markdown.test.ts'
      - '.github/workflows/ui-v3-format-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Show formatter output
        run: |
          pnpm exec oxfmt             apps/knowledge-portal/app/global.css             apps/knowledge-portal/components/brain-switcher.tsx             apps/knowledge-portal/components/document-actions.tsx             apps/knowledge-portal/components/knowledge-status.tsx             apps/knowledge-portal/lib/brain-markdown.ts             apps/knowledge-portal/lib/brain-markdown.test.ts
          git diff --             apps/knowledge-portal/app/global.css             apps/knowledge-portal/components/brain-switcher.tsx             apps/knowledge-portal/components/document-actions.tsx             apps/knowledge-portal/components/knowledge-status.tsx             apps/knowledge-portal/lib/brain-markdown.ts             apps/knowledge-portal/lib/brain-markdown.test.ts
