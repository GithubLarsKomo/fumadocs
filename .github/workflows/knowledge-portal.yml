name: Knowledge Portal

on:
  pull_request:
    paths:
      - 'apps/knowledge-portal/**'
      - 'packages/google-drive/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/knowledge-portal.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Fumadocs packages
        run: pnpm build --filter=./packages/*

      - name: Build Knowledge Portal
        run: pnpm --filter knowledge-portal build

      - name: Verify runtime public assets packaging
        run: |
          test -f apps/knowledge-portal/public/brand/logo-dark.svg
          test -f apps/knowledge-portal/public/brand/favicon.svg
          grep -Fq 'COPY --from=builder /app/apps/knowledge-portal/public ./apps/knowledge-portal/public' apps/knowledge-portal/Dockerfile
