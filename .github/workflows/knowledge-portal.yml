name: Knowledge Portal

on:
  pull_request:
    paths:
      - 'apps/knowledge-portal/**'
      - 'packages/google-drive/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/knowledge-portal.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Drive adapter
        run: pnpm --filter fumadocs-google-drive build

      - name: Build Knowledge Portal
        run: pnpm --filter knowledge-portal build
