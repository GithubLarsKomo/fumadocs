name: Knowledge Portal v6 Format Preview

on:
  push:
    branches:
      - feat/knowledge-portal-v6

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Format v6 files
        run: |
          pnpm exec oxfmt \
            'apps/knowledge-portal/app/api/drive/files/[fileId]/route.ts' \
            'apps/knowledge-portal/app/drive/[[...slug]]/page.tsx' \
            apps/knowledge-portal/app/global.css \
            apps/knowledge-portal/app/page.tsx \
            apps/knowledge-portal/app/status/page.tsx \
            apps/knowledge-portal/components/faceted-search.tsx \
            apps/knowledge-portal/lib/related-knowledge.test.ts \
            apps/knowledge-portal/lib/source-health.ts
      - name: Show formatter diff
        run: git diff
