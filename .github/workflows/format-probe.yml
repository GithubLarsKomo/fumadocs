name: Format Probe

on:
  pull_request:
    branches: [dev]
    paths:
      - 'apps/knowledge-portal/lib/search/brain-graph.ts'
      - '.github/workflows/format-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - name: Show formatter output
        run: |
          pnpm exec oxfmt apps/knowledge-portal/lib/search/brain-graph.ts
          git diff -- apps/knowledge-portal/lib/search/brain-graph.ts
